# CI — extended in Module 7 with a Docker build + Trivy scan, and image
# publishing to GitHub Container Registry (chosen over Azure Container
# Registry for cost reasons — see PLAN.md/LEARNING_LOG.md Module 7 Chapter 9).
# OIDC-authenticated Azure deploy comes next in the same module. Real
# deployment (a rollout restart against the live k3s cluster) added after
# Module 12 went live, once there was an actual production target to deploy
# to and it became clear a merge to main never got in front of a real user
# without a manual `kubectl rollout restart` first.
name: CI

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

  docker-build-scan:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/azureops-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/azureops-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t azureops-backend:${{ github.sha }} -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t azureops-frontend:${{ github.sha }} -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ./frontend

      # Backend: we control every dependency directly (requirements.txt), so
      # CRITICAL+HIGH is a fair, immediately-actionable bar. backend/.trivyignore
      # documents the small number of exceptions (unfixable transitive pins,
      # non-runtime build tooling) with reasons, reviewed periodically.
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: azureops-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: backend/.trivyignore

      # Frontend: nginx:alpine's OS packages (curl, openssl, libxml2, etc.)
      # produce dozens of HIGH findings that are entirely base-image
      # churn, not our own code, and not exercised by how this container
      # actually runs (static file serving + reverse proxy). Gating on
      # CRITICAL only here; HIGH findings get cleared by periodically
      # bumping the base image tag (already done once this session:
      # nginx:1.27-alpine -> 1.29-alpine), not by blocking every commit.
      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: azureops-frontend:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # Publish only actual merges to main -- PRs get full validation (test,
      # build, scan) above but never publish an image. GITHUB_TOKEN already
      # has packages:write scope granted above; no separate registry
      # credential needed at all, which is the whole cost/complexity
      # advantage of ghcr.io over ACR for this project right now.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  # OIDC-authenticated Azure login -- no stored client secret anywhere. The
  # App Registration (azureops-copilot-github-oidc) has a Federated Identity
  # Credential trusting ONLY repo:consciouslake/Devops-tut:ref:refs/heads/main,
  # so this token exchange only works from this exact repo's main branch,
  # not from a fork or any other branch. Originally scoped to just proving
  # passwordless auth worked (Module 7), since there was no real deployment
  # target yet -- now also triggers a real rollout restart against the live
  # k3s cluster (added after Module 12 went live), reusing this same OIDC
  # identity's existing Contributor role rather than granting anything new.
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # A GitHub Environment gate -- "production" requires a manual approval
    # before this job's steps run at all, even though everything upstream
    # (test, scan, publish) already passed. This is Continuous Delivery, not
    # Continuous Deployment (see Chapter 1's CI-vs-CD framing): a human
    # decides when the verified, published artifact actually gets acted on.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify passwordless auth against real Azure resources
        run: |
          az account show --query "{subscription:name, user:user.name, authType:user.type}" -o table
          az resource list --resource-group azureops-copilot-rg --query "sort_by([], &name)[].{name:name, type:type}" -o table

      # The app runs on the self-managed k3s cluster (Module 8), not an Azure
      # PaaS deploy target -- so "deploy" here means telling the cluster to
      # pull the freshly-published :latest images. There's no direct network
      # path from a GitHub-hosted runner to the cluster's API server (it's
      # only reachable inside the VNet), so this reuses the same az vm
      # run-command pattern used throughout this project's own manual
      # deploys instead of opening the API server to the internet. The OIDC
      # identity's Contributor role (flagged as broader than it needed to be
      # in Module 11's RBAC audit, deliberately left as-is for exactly this
      # kind of future automation) already covers the VM run-command action
      # -- no new permission grant was needed to add this step.
      - name: Redeploy live cluster (pull fresh images)
        run: |
          az vm run-command invoke \
            --resource-group azureops-copilot-rg \
            --name app-vm1 \
            --command-id RunShellScript \
            --scripts "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
              kubectl rollout restart deployment backend -n azureops-copilot
              kubectl rollout restart deployment frontend -n azureops-copilot
              kubectl rollout status deployment backend -n azureops-copilot --timeout=120s
              kubectl rollout status deployment frontend -n azureops-copilot --timeout=120s"

      - name: Verify the live app is actually healthy after redeploy
        run: |
          curl -sf -o /dev/null -w "HTTPS root: HTTP %{http_code}\n" https://devopspk.online/
          curl -sf -o /dev/null -w "health: HTTP %{http_code}\n" https://devopspk.online/health
