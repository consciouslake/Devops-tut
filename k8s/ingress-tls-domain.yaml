apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azureops-copilot-ingress-tls
  namespace: azureops-copilot
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - devopspk.online
    - www.devopspk.online
  rules:
  - host: devopspk.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: waf-proxy
            port:
              number: 80
  - host: www.devopspk.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: waf-proxy
            port:
              number: 80
